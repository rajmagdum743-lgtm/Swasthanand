services:
  postgres:
    image: postgres:16-alpine
    container_name: swasthanand-db
    environment:
      POSTGRES_DB: swasthanand
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: swasthanand-redis
    ports:
      - "6379:6379"
