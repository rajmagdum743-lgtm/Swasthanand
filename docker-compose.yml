version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: swasthanand-db
    environment:
      POSTGRES_DB: swasthanand
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swasthanand-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthanand-backend
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/swasthanand
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - swasthanand-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasthanand-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - swasthanand-network

volumes:
  postgres-data:

networks:
  swasthanand-network:
    driver: bridge
