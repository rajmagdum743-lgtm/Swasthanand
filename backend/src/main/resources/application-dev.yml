spring:
  config:
    activate:
      on-profile: dev
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:h2:mem:///swasthanand;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_R2DBC_USERNAME:sa}
    password: ${SPRING_R2DBC_PASSWORD:}
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}

app:
  payment:
    razorpay:
      enabled: true

logging:
  level:
    com.swasthanand.api: DEBUG

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_placeholder_id}
    secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
